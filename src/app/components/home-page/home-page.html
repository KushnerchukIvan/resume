<main class="main">
  <img [src]="photoUrl" alt="my_photo" />
  <div class="mainDiv">
    <h1>
      <span class="first">Ivan</span>
      <br />
      <span class="last">Kushnerchuk</span>
    </h1>
    <span class="typed">{{ displayText() }}</span>
    <span class="cursor">|</span>
    <p>
      Computer Engineering student. <br />
      I develop web applications with Angular, TypeScript, and Node.js <br />
    </p>
    <div class="home_buttons">
      <a routerLink="/projects"><button class="VIEW_PROJECTS_BUTTON">▸ VIEW PROJECTS</button></a>
      <a routerLink="/contact"><button class="CONTACT_BUTTON">↗ CONTACT</button></a>
    </div>
    <div class="about-me-home-block">
      <div class="block">
        <div class="num">8</div>
        <div class="label">SKILLS</div>
      </div>
      <div class="block">
        <div class="num">4</div>
        <div class="label">PROJECTS</div>
      </div>
      <div class="block">
        <div class="num">100%</div>
        <div class="label">READY TO WORK</div>
      </div>
    </div>
  </div>
</main>
